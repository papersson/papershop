<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio desk</title>
<link rel="stylesheet" href="/live/engine/node_modules/@fontsource/ibm-plex-sans/400.css"><link rel="stylesheet" href="/live/engine/node_modules/@fontsource/ibm-plex-sans/500.css"><link rel="stylesheet" href="/live/engine/node_modules/@fontsource/ibm-plex-mono/400.css">
<style>
:root{color-scheme:dark;--bg:#111419;--panel:#191d23;--raised:#222832;--line:#343c47;--ink:#e0e5eb;--muted:#a2adb9;--faint:#717e8c;--accent:#9acdf2;--good:#9cc6ac;--bad:#f29d91;--quiet:#d9c28d;--shadow:#080a0d;--board:#252a33}

:root.light{color-scheme:light;--bg:#edede9;--panel:#fafaf7;--raised:#e1e5e5;--line:#b9c2c7;--ink:#202a33;--muted:#505e68;--faint:#65737d;--accent:#24658d;--good:#397552;--bad:#ad372e;--quiet:#80621f;--shadow:#d1d5d5;--board:#dce0df}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 'IBM Plex Sans',system-ui,sans-serif;min-width:1120px;height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button,select{background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{background:var(--raised)}
button:disabled{opacity:.4;cursor:default}
button[aria-pressed=true],button.active{background:var(--raised);color:var(--accent);border-color:var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px}
textarea{resize:vertical;min-height:100px;width:100%;line-height:1.5}
h1,h2,p{margin:0}
h1{font-size:18px;font-weight:500;letter-spacing:-.2px}
h2{font-size:14px;font-weight:500}
small,.muted{color:var(--muted);font-size:12px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.spacer{flex:1}
header{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{color:var(--muted);letter-spacing:2px;font-size:11px;margin-right:10px}
#statusbar{height:38px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);font-size:13px}
#alive{width:7px;height:7px;border-radius:50%;background:var(--good)}
#eta{color:var(--muted)}
#replayTag{color:var(--quiet);display:none}
.workspace{height:calc(100vh - 120px);display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) var(--timeline-height,298px)}
.viewer{min-height:0;display:flex;flex-direction:column;padding:12px 18px 0;position:relative}
.screen-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.screen{aspect-ratio:16/9;position:relative;width:100%;max-height:100%;background:#0d1014;box-shadow:0 8px 26px var(--shadow);overflow:hidden}
#video,#live{width:100%;height:100%;border:0;position:absolute;inset:0;object-fit:contain}
#live{display:none;pointer-events:none;color-scheme:dark;transform:translateZ(0)}
.caption-mask{position:absolute;bottom:0;left:0;right:0;height:14.82%;background:#0d1014;display:none}
#compareLabel{position:absolute;top:10px;left:12px;background:#111b;color:#fff;padding:3px 8px;font-size:12px;display:none}
.transport{height:46px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.transport button{min-width:34px}
.transport #play{font-size:18px}
.transport #time{font-size:12px;min-width:132px}
.transport select{font-size:12px}
.transport .hint{font-size:11px;color:var(--faint)}
#message{position:absolute;left:30px;top:20px;background:var(--panel);padding:8px;display:none}
aside{grid-column:2;grid-row:1/3;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px 16px}
aside .heading{display:flex;align-items:center;gap:8px;margin-bottom:16px}
#editor{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
#editor[hidden]{display:none}
.formrow{display:flex;align-items:center;gap:7px;margin:9px 0}
.formrow select{border-color:var(--line);max-width:100%}
.formrow input{width:80px;padding:5px;font-family:monospace}
#anchor{font-size:12px;color:var(--muted);margin:10px 0;max-height:60px;overflow:auto}
#delivery{font-size:12px;min-height:20px;color:var(--good);padding-top:7px}
.note{padding:12px 0;border-bottom:1px solid var(--line)}
.note.suggested{border-left:2px solid var(--quiet);padding-left:10px}
.note .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:6px}
.note .body{white-space:pre-wrap;font-size:13px}
.note .reply{color:var(--good);font-size:12px;margin-top:8px}
.note button{font-size:11px;padding:3px 5px}
.note.done .body{color:var(--muted)}
#changes{font-size:12px;color:var(--muted);margin-bottom:18px}
#changes li{margin:6px 0}
#raw{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 'IBM Plex Mono',monospace;max-height:54vh;overflow:auto}
.timeline{grid-column:1;grid-row:2;border-top:1px solid var(--line);position:relative;background:var(--panel);overflow:auto;padding:0 18px 10px}
.tl-head{height:30px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.tl-head .title{width:140px}
.tl-head button{font-size:11px;padding:3px 6px}
.track{display:grid;grid-template-columns:140px minmax(0,1fr);min-height:25px;position:relative}
.track-label{font-size:10px;color:var(--muted);letter-spacing:.5px;display:flex;align-items:center;gap:4px;text-transform:uppercase}
.track-label button{font-size:10px;letter-spacing:0;padding:2px 4px;text-transform:none}
.rail{position:relative;min-width:0;border-top:1px solid var(--line)}
#ruler{height:22px;cursor:crosshair}
.ruler-tick{position:absolute;font:10px 'IBM Plex Mono',monospace;color:var(--faint);top:3px}
.beat{position:absolute;top:2px;height:23px;padding:3px 6px;text-align:left;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line);border-radius:0}
.beat:hover{background:var(--raised)}
#pictures{height:42px;display:flex;overflow:hidden}
.thumb{position:relative;flex:1;min-width:0;padding:0;border:0;border-right:2px solid var(--panel);border-radius:0;overflow:hidden;background:var(--board)}
.thumb img{width:100%;height:40px;object-fit:cover;display:block;transition:opacity .3s}
.thumb.board img{opacity:.08}
.thumb .board-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
#voice{height:32px;width:100%;display:block}
#sound,#marks{height:21px}
.mark{position:absolute;top:2px;transform:translateX(-50%);padding:0 3px;font-size:13px;color:var(--accent);border-radius:2px}
.mark.failed{color:var(--bad)}
.mark.passed{color:var(--good)}
.mark.pin{color:var(--quiet)}
@keyframes fade{to{opacity:.3}
}
.lane{height:28px}
.lane .rail{cursor:pointer}
.lane-bar{position:absolute;top:3px;height:22px;background:var(--board);border-left:2px solid var(--faint);display:flex;align-items:center;gap:6px;padding:0 6px;overflow:hidden;font-size:11px;white-space:nowrap}
.lane-bar.building{border-color:var(--accent)}
.lane-bar.built{border-color:var(--good)}
.lane-bar.failing,.lane-bar.stalled{border-color:var(--bad)}
.lane-bar.quiet{border-color:var(--quiet)}
.lane-state{font-size:9px;text-transform:none;letter-spacing:0;color:var(--faint)}
.lane .track-label{font-size:11px}
.lane .track-label strong{font-weight:500;color:var(--ink)}
.lane .last-action{overflow:hidden;text-overflow:ellipsis}
.lane-bar.landed{animation:land .3s ease-out}
@keyframes land{from{background:var(--raised)}
to{background:var(--board)}
}
#playhead{position:absolute;top:30px;bottom:10px;width:1px;background:var(--accent);pointer-events:none;z-index:4}
#playhead:before{content:'';position:absolute;top:0;left:-4px;border-top:6px solid var(--accent);border-left:4px solid transparent;border-right:4px solid transparent}
#selection{position:absolute;top:52px;bottom:10px;background:#8db8e220;border-left:1px solid var(--accent);border-right:1px solid var(--accent);pointer-events:none;display:none;z-index:3}
footer{height:26px;padding:4px 20px;color:var(--faint);font-size:11px;border-top:1px solid var(--line);display:flex;gap:22px}
kbd{font:10px 'IBM Plex Mono',monospace;color:var(--muted)}
.pulse{animation:pulse 1.1s ease-out}
@keyframes pulse{50%{box-shadow:0 0 0 5px #9acdf230}
}
#hoverPreview{display:none;position:fixed;width:320px;height:180px;z-index:8;pointer-events:none;border:1px solid var(--line);box-shadow:0 12px 30px var(--shadow);background:var(--bg)}
#hoverPreview iframe{width:100%;height:100%;border:0}
#connection{color:var(--quiet)}

</style></head><body>

<script>
