<!doctype html>
<html><head><meta charset="utf-8"><title>studio live</title>
<link rel="stylesheet" href="./node_modules/@fontsource/ibm-plex-sans/400.css">
<link rel="stylesheet" href="./node_modules/@fontsource/ibm-plex-sans/500.css">
<link rel="stylesheet" href="./node_modules/@fontsource/ibm-plex-sans/600.css">
<link rel="stylesheet" href="./node_modules/@fontsource/ibm-plex-sans/700.css">
<link rel="stylesheet" href="./node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="./node_modules/@fontsource/ibm-plex-mono/500.css">
<link rel="stylesheet" href="./src/theme.css">
<!-- Scenes import the engine as @studio/ and three.js by name; these resolve against this page, so the
     same imports work in the renderer (/engine/) and on the desk (/live/engine/). -->
<script type="importmap">{"imports": {
  "@studio/": "./src/",
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
}}</script>
<style>

html, body { margin: 0; background: var(--bg); overflow: hidden; }
/* The page paints the background; the light canvas and the 3D canvas (each hidden unless a frame
   draws on it) sit under the SVG stage, light lowest. */
svg, canvas#gl, canvas#light { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; }
svg { display: block; }
canvas#gl, canvas#light { display: none; }
</style></head>
<body>
<canvas id="light"></canvas>
<canvas id="gl"></canvas>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs></svg>
<script type="module">
// Query: video=<base URL of the video folder>, layout=<URL of layout.json>. Exposes window.studio.
import { boot } from './src/player.js'
const q = new URLSearchParams(location.search)
boot({ svg: document.getElementById('stage'), canvas: document.getElementById('gl'), light: document.getElementById('light'), video: q.get('video'), layout: q.get('layout') })
  .then(api => { window.studio = api; window.studioReady = true; if (q.get('play')) parent.postMessage({ studioLive: 'ready' }, '*') })
  .catch(e => { window.studioError = String(e && e.stack ? e.stack : e); console.error(e) })
</script>
</body></html>
