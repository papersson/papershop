<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a hash table finds a key</title>
<link rel="stylesheet" href="walk.css">
<style>
/* The hash table: one custom piece, so filling it, searching one bucket and marking a key are one
   change each. It lights its own parts: the searched bucket stays at full ink, the rest fade. */
.w-buckets { font-family: var(--mono); font-size: 24px; }
.hb-row { position: absolute; left: 0; height: 46px; transition: opacity .6s var(--ease); }
.hb-index { position: absolute; left: 0; width: 50px; height: 46px; line-height: 46px; text-align: right; color: var(--dim); }
.hb-empty { position: absolute; left: 90px; top: 23px; width: 56px; border-top: 1.5px solid var(--faint); }
.hb-entry { position: absolute; top: 0; height: 46px; width: 160px; box-sizing: border-box; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; border-radius: 8px; background: var(--tint);
  opacity: 0; transform: translateY(-34px);
  transition: opacity .5s var(--ease), transform .8s var(--ease); transition-delay: calc(var(--i) * 110ms); }
.hb-entry .k { color: var(--ink); }
.hb-entry .v { color: var(--b); }
.hb-link { position: absolute; top: 23px; width: 40px; border-top: 1.5px solid var(--dim);
  opacity: 0; transition: opacity .5s var(--ease); transition-delay: calc(var(--i) * 110ms + 300ms); }
.hb-link::after { content: ""; position: absolute; right: -1px; top: -5.5px; border: 5px solid transparent; border-left: 7px solid var(--dim); border-right: 0; }
.w-buckets.filled .hb-entry { opacity: 1; transform: none; }
.w-buckets.filled .hb-link { opacity: 1; }
.w-buckets.filled .hb-row.has-entries .hb-empty { opacity: 0; }
.hb-row.is-faded { opacity: .18; }
.hb-mark { position: absolute; top: 0; height: 46px; line-height: 46px; font-family: var(--sans); font-size: 32px;
  font-weight: 700; opacity: 0; transition: opacity .4s var(--ease); }
.hb-mark.is-no { color: var(--no); }
.hb-mark.is-yes { color: var(--yes); }
.hb-mark.on { opacity: 1; }
.hb-mark.on.is-past { opacity: .35; }
.hb-end { position: absolute; top: 0; height: 46px; display: flex; align-items: center; gap: 10px; color: var(--ink);
  opacity: 0; transition: opacity .4s var(--ease); }
.hb-end::before { content: ""; width: 38px; border-top: 1.5px solid var(--dim); }
.hb-end.on { opacity: 1; }
</style>
</head>
<body>
<script src="walk.js"></script>
<script>
// Every number below comes from values.py, which hashes with the same FNV-1a as the code chapter and
// checks that these lines appear in this file. The stock counts are an example; the buckets are real.
// Insertion order, as [key, count, bucket]:
const FRUIT = [
  ['apple', 3, 7],
  ['date', 12, 1],
  ['mango', 2, 5],
  ['orange', 9, 3],
  ['lime', 6, 4],
  ['fig', 4, 5],
  ['peach', 7, 6],
];
const FIG = { bytes: '66 69 67', hash: '0xc1e49a15', bucket: 5 };
const PEAR = { hash: '0xd01fc26d', bucket: 5 };
const TALLY = '2 of 7 keys compared';

// Geometry of the table, in stage pixels.
const T = { x: 700, y: 150, row: 66, first: 90, step: 270 };
const entryX = j => T.x + T.first + j * T.step;           // left edge of entry j in a bucket
const rowY = b => T.y + b * T.row;                        // top of bucket b's row
const chipAt = (b) => ({ x: 580, y: rowY(b) - 30 });      // a chip whose value sits level with bucket b

// Tokens: 'filled', 'focus:B' fades every bucket but B, 'no:B.J' and 'yes:B.J' mark entry J of
// bucket B, 'end:B' marks the end of bucket B's list.
Walk.piece('buckets', (el, o, page) => {
  const rows = [], marks = {}, ends = {};
  for (let b = 0; b < 8; b++) {
    const row = page.make('div', 'hb-row', el);
    row.dataset.bucket = b;
    row.style.top = b * T.row + 'px';
    page.make('div', 'hb-index', row, String(b));
    page.make('div', 'hb-empty', row);
    rows.push(row);
  }
  const counts = Array(8).fill(0);
  o.fruit.forEach(([key, count, b], i) => {
    const j = counts[b]++, row = rows[b];
    row.classList.add('has-entries');
    if (j > 0) {
      const link = page.make('div', 'hb-link', row);
      link.style.left = T.first + (j - 1) * T.step + 216 + 'px';
      link.style.setProperty('--i', i);
    }
    const e = page.make('div', 'hb-entry', row, `<span class="k">${page.esc(key)}</span><span class="v">${count}</span>`);
    e.dataset.entry = `${b}.${j}`;
    e.style.left = T.first + j * T.step + 'px';
    e.style.setProperty('--i', i);
    const m = page.make('div', 'hb-mark', row);
    m.style.left = T.first + j * T.step + 168 + 'px';
    marks[`${b}.${j}`] = m;
    row.style.width = T.first + j * T.step + 160 + 'px';
  });
  rows.forEach((row, b) => {
    if (!counts[b]) return;
    const end = page.make('div', 'hb-end', row, '<span>end</span>');
    end.style.left = T.first + (counts[b] - 1) * T.step + 216 + 'px';
    ends[b] = end;
  });
  el.style.width = '900px'; el.style.height = 8 * T.row + 'px';
  return cls => {
    const focus = cls.find(c => c.startsWith('focus:'));
    rows.forEach((r, b) => r.classList.toggle('is-faded', !!focus && String(b) !== focus.slice(6)));
    // The newest mark is the one to read; earlier ones step down.
    const newest = cls.filter(c => /^(no|yes|end):/.test(c)).pop();
    Object.entries(marks).forEach(([at, m]) => {
      const no = cls.includes('no:' + at), yes = cls.includes('yes:' + at);
      m.textContent = no ? '✗' : yes ? '✓' : m.textContent;
      m.classList.toggle('is-no', no); m.classList.toggle('is-yes', yes); m.classList.toggle('on', no || yes);
      m.classList.toggle('is-past', newest !== (no ? 'no:' : 'yes:') + at);
    });
    Object.entries(ends).forEach(([b, e]) => e.classList.toggle('on', cls.includes('end:' + b)));
    cls.filter(c => /^(no|yes|end):/.test(c)).forEach(c => {
      if (!marks[c.split(':')[1]] && !ends[c.split(':')[1]]) throw new Error(`buckets: nothing at '${c}'`);
    });
  };
});

const chip = (label, value, tone, states, ch, start) => ({ piece: 'chip', label, value, tone, states, ch, start });
// One table per chapter, all in one place, so each lookup starts from a clean table.
const table = (ch, start, extra) => ({ piece: 'buckets', fruit: FRUIT, ch: [ch], start, states: Object.assign({
  filled: { x: T.x, y: T.y, cls: ['filled'] }, focus: { x: T.x, y: T.y, cls: ['filled', 'focus:5'] } }, extra) });
const at = (...tokens) => ({ x: T.x, y: T.y, cls: ['filled', 'focus:5', ...tokens] });

Walk.page({
  title: 'How a hash table finds a key',
  cover: true,
  chapters: [
    'Seven fruits go into eight buckets',
    'Looking up fig',
    'Looking up a key that is not there',
    'Only one bucket was searched',
    'The same steps in Python',
  ],
  notes: [
    'The table is an example: seven fruits with stock counts. The bucket each fruit sits in is real, computed with FNV-1a by values.py.',
    'Follow one key all the way. Bytes, then one 32-bit number, then a remainder, then a short walk. Every number on screen is computed, not typed in.',
    'A miss costs the same walk as a hit in the same bucket. The lookup can only say no after the whole bucket.',
    'This is the point to land. The cost is the length of one bucket, which stays short while the table keeps enough buckets.',
    'Each margin number is the click that showed that line. Readers can jump back with the link page.html#N.',
  ],
  objects: {
    table1: table(1, undefined, { empty: { x: T.x, y: T.y } }),

    table2: table(2, 'filled', { no: at('no:5.0'), yes: at('no:5.0', 'yes:5.1') }),
    figKey: chip('key', 'fig', 'a', { shown: { x: 100, y: 170 } }, [2]),
    figBytes: chip('UTF-8 bytes, hex', FIG.bytes, null, { shown: { x: 100, y: 280 } }, [2]),
    figHash: chip('FNV-1a, 32 bits', FIG.hash, null, { shown: { x: 100, y: 390 } }, [2]),
    figBucket: chip('hash % 8', String(FIG.bucket), 'c', { shown: { x: 100, y: 500 }, atBucket: chipAt(FIG.bucket) }, [2]),
    figValue: chip('count', '4', 'b', { inside: { x: entryX(1) + 96, y: rowY(5) - 30, o: 0 }, out: { x: 100, y: 500 } }, [2], 'inside'),

    table3: table(3, 'filled', { no1: at('no:5.0'), no2: at('no:5.0', 'no:5.1'), end: at('no:5.0', 'no:5.1', 'end:5') }),
    pearKey: chip('key', 'pear', 'a', { shown: { x: 100, y: 170 } }, [3]),
    pearHash: chip('FNV-1a, 32 bits', PEAR.hash, null, { shown: { x: 100, y: 280 } }, [3]),
    pearBucket: chip('hash % 8', String(PEAR.bucket), 'c', { made: { x: 100, y: 390, o: 0 }, atBucket: chipAt(PEAR.bucket) }, [3], 'made'),

    table4: table(4, 'filled'),
    tally: { piece: 'text', text: TALLY, size: 28, ch: [4], states: { shown: { x: entryX(1) + 200, y: rowY(5) + 5 } } },

    code: { piece: 'code', ch: [5], lines: [
      ['', 'def lookup(buckets, key):'],
      ['', '    h = 2166136261'],
      ['4', '    for b in key.encode():'],
      ['5', '        h = (h ^ b) * 16777619 % 2**32'],
      ['6', '    bucket = buckets[h % 8]'],
      ['9', '    for k, v in bucket:'],
      ['10', '        if k == key:'],
      ['11', '            return v'],
      ['18', '    return None'],
    ], states: { shown: { x: 330, y: 200, cls: ['marks'] }, hash: { x: 330, y: 200, cls: ['lit:2-5'] },
                 walk: { x: 330, y: 200, cls: ['lit:6-8'] }, miss: { x: 330, y: 200, cls: ['lit:9'] } } },
  },
  clicks: [
    { chapter: 1, caption: 'A hash table with eight buckets, numbered 0 to 7, all empty.', object: 'table1', state: 'empty' },
    { chapter: 1, caption: 'Each fruit is stored in bucket number hash(fruit) % 8.', object: 'table1', state: 'filled', settle: 1900 },

    { chapter: 2, caption: 'Look up `fig` to get its stock count.', object: 'figKey', state: 'shown' },
    { chapter: 2, caption: 'The hash function reads bytes, and `fig` in UTF-8 is three bytes.', object: 'figBytes', state: 'shown' },
    { chapter: 2, caption: 'FNV-1a hashes the three bytes into one 32-bit number.', object: 'figHash', state: 'shown' },
    { chapter: 2, caption: 'The bucket number is the hash modulo 8, the number of buckets.', object: 'figBucket', state: 'shown' },
    { chapter: 2, object: 'figBucket', state: 'atBucket' },
    { chapter: 2, caption: '`fig` can only be in bucket 5, so the others are skipped.', object: 'table2', state: 'focus' },
    { chapter: 2, caption: 'The first key in bucket 5 is `mango`, not `fig`.', object: 'table2', state: 'no', with: ['figKey'] },
    { chapter: 2, object: 'table2', state: 'yes', with: ['figKey'] },
    { chapter: 2, caption: '`fig` matches, so the lookup returns the count stored with it.', object: 'figValue', state: 'out' },

    { chapter: 3, caption: 'Now look up `pear`, a key that was never stored.', object: 'pearKey', state: 'shown' },
    { chapter: 3, caption: 'FNV-1a hashes `pear` the same way, to a different number.', object: 'pearHash', state: 'shown' },
    { chapter: 3, caption: 'That number modulo 8 is also 5, the same bucket as `fig`.', object: 'pearBucket', state: 'atBucket' },
    { chapter: 3, object: 'table3', state: 'focus' },
    { chapter: 3, caption: '`mango` is not `pear`.', object: 'table3', state: 'no1', with: ['pearKey'] },
    { chapter: 3, caption: '`fig` is not `pear`.', object: 'table3', state: 'no2', with: ['pearKey'] },
    { chapter: 3, caption: 'Bucket 5 has no more keys, so `pear` is not stored.', object: 'table3', state: 'end' },

    { chapter: 4, caption: 'Both lookups searched bucket 5 and no other bucket.', object: 'table4', state: 'focus' },
    { chapter: 4, caption: "A lookup's cost is the number of keys in one bucket.", object: 'tally', state: 'shown' },

    { chapter: 5, caption: 'Each margin number is the click that showed that step.', object: 'code', state: 'shown' },
    { chapter: 5, caption: 'These lines compute the FNV-1a hash and pick the bucket.', object: 'code', state: 'hash' },
    { chapter: 5, caption: 'This loop compares `key` with each key in the bucket.', object: 'code', state: 'walk' },
    { chapter: 5, caption: 'If no key matches, the loop ends and the function returns None.', object: 'code', state: 'miss' },
  ],
});
</script>
</body>
</html>
