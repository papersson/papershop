<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a hash table finds a key</title>
<link rel="stylesheet" href="walk.css">
<style>
/* The hash table: one custom piece, so filling it and fading its other buckets are one change each. */
.w-buckets { font-family: var(--mono); font-size: 24px; }
.hb-row { position: absolute; left: 0; height: 46px; transition: opacity .6s var(--ease); }
.hb-index { position: absolute; left: 0; width: 50px; height: 46px; line-height: 46px; text-align: right; color: var(--dim); }
.hb-empty { position: absolute; left: 90px; top: 23px; width: 56px; border-top: 1.5px solid var(--faint); }
.hb-entry { position: absolute; top: 0; height: 46px; width: 160px; box-sizing: border-box; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; border-radius: 8px; background: var(--tint);
  opacity: 0; transform: translateY(-34px);
  transition: opacity .5s var(--ease), transform .8s var(--ease); transition-delay: calc(var(--i) * 110ms); }
.hb-entry .k { color: var(--ink); }
.hb-entry .v { color: var(--b); }
.hb-link { position: absolute; top: 23px; width: 40px; border-top: 1.5px solid var(--faint);
  opacity: 0; transition: opacity .5s var(--ease); transition-delay: calc(var(--i) * 110ms + 300ms); }
.hb-link::after { content: ""; position: absolute; right: -1px; top: -5.5px; border: 5px solid transparent; border-left: 7px solid var(--faint); border-right: 0; }
.w-buckets.filled .hb-entry { opacity: 1; transform: none; }
.w-buckets.filled .hb-link { opacity: 1; }
.w-buckets.filled .hb-row.has-entries .hb-empty { opacity: 0; }
.hb-row.is-faded { opacity: .2; }
.end-mark { color: var(--dim); font-family: var(--mono); font-size: 24px; display: flex; align-items: center; gap: 10px; height: 46px; }
.end-mark::before { content: ""; width: 38px; border-top: 1.5px solid var(--faint); }
</style>
</head>
<body>
<script src="walk.js"></script>
<script>
// Every number below comes from values.py, which hashes with the same FNV-1a as the code chapter and
// checks that these lines appear in this file. The stock counts are an example; the buckets are real.
// Insertion order, as [key, count, bucket]:
const FRUIT = [
  ['apple', 3, 7],
  ['date', 12, 1],
  ['mango', 2, 5],
  ['orange', 9, 3],
  ['lime', 6, 4],
  ['fig', 4, 5],
  ['peach', 7, 6],
];
const FIG = { bytes: '66 69 67', hash: '0xc1e49a15', bucket: 5 };
const PEAR = { hash: '0xd01fc26d', bucket: 5 };
const TALLY = '2 of 7 keys compared';

// Geometry of the table, in stage pixels.
const T = { x: 700, y: 150, row: 66, first: 90, step: 270 };
const entryX = j => T.x + T.first + j * T.step;           // left edge of entry j in a bucket
const rowY = b => T.y + b * T.row;                        // top of bucket b's row
const markAt = j => ({ x: entryX(j) + 184, y: rowY(5) + 5 });
const chipAt = (b) => ({ x: 590, y: rowY(b) - 26 });      // a chip whose value sits level with bucket b

Walk.piece('buckets', (el, o, page) => {
  const rows = [];
  for (let b = 0; b < 8; b++) {
    const row = page.make('div', 'hb-row', el);
    row.dataset.bucket = b;
    row.style.top = b * T.row + 'px';
    page.make('div', 'hb-index', row, String(b));
    page.make('div', 'hb-empty', row);
    rows.push(row);
  }
  const counts = Array(8).fill(0);
  o.fruit.forEach(([key, count, b], i) => {
    const j = counts[b]++, row = rows[b];
    row.classList.add('has-entries');
    if (j > 0) {
      const link = page.make('div', 'hb-link', row);
      link.style.left = T.first + (j - 1) * T.step + 216 + 'px';
      link.style.setProperty('--i', i);
    }
    const e = page.make('div', 'hb-entry', row, `<span class="k">${page.esc(key)}</span><span class="v">${count}</span>`);
    e.dataset.entry = `${b}.${j}`;
    e.style.left = T.first + j * T.step + 'px';
    e.style.setProperty('--i', i);
    row.style.width = T.first + j * T.step + 160 + 'px';
  });
  el.style.width = '900px'; el.style.height = 8 * T.row + 'px';
  return cls => {
    const focus = cls.find(c => c.startsWith('focus:'));
    rows.forEach((r, b) => r.classList.toggle('is-faded', !!focus && String(b) !== focus.slice(6)));
  };
});

const chip = (label, value, tone, states, ch, start) => ({ piece: 'chip', label, value, tone, states, ch, start });
const mark = (verdict, j, ch) => ({ piece: 'text', text: '', verdict, size: 30, ch: [ch], states: { shown: markAt(j) } });

Walk.page({
  title: 'How a hash table finds a key',
  cover: true,
  chapters: [
    'Seven fruits go into eight buckets',
    'Looking up fig',
    'Looking up a key that is not there',
    'Only one bucket was searched',
    'The same steps in Python',
  ],
  notes: [
    'The table is an example: seven fruits with stock counts. The bucket each fruit sits in is real, computed with FNV-1a by values.py.',
    'Follow one key all the way. Bytes, then one 32-bit number, then a remainder, then a short walk. Every number on screen is computed, not typed in.',
    'A miss costs the same walk as a hit in the same bucket. The lookup can only say no after the whole bucket.',
    'This is the point to land. The cost is the length of one bucket, which stays short while the table keeps enough buckets.',
    'Each margin number is the click that showed that line. Readers can jump back with the link page.html#N.',
  ],
  objects: {
    table: { piece: 'buckets', fruit: FRUIT, ch: [1, 2, 3, 4], states: {
      empty: { x: T.x, y: T.y }, filled: { x: T.x, y: T.y, cls: ['filled'] },
      focus: { x: T.x, y: T.y, cls: ['filled', 'focus:5'] } } },

    figKey: chip('key', 'fig', 'a', { shown: { x: 100, y: 170 } }, [2]),
    figBytes: chip('UTF-8 bytes, hex', FIG.bytes, null, { shown: { x: 100, y: 280 } }, [2]),
    figHash: chip('FNV-1a, 32 bits', FIG.hash, null, { shown: { x: 100, y: 390 } }, [2]),
    figBucket: chip('hash % 8', String(FIG.bucket), 'c', { shown: { x: 100, y: 500 }, atBucket: chipAt(FIG.bucket) }, [2]),
    figMiss: mark('no', 0, 2),
    figHit: mark('yes', 1, 2),
    figValue: chip('count', '4', 'b', { inside: { x: entryX(1) + 96, y: rowY(5) - 26, o: 0 }, out: { x: 100, y: 500 } }, [2], 'inside'),

    pearKey: chip('key', 'pear', 'a', { shown: { x: 100, y: 170 } }, [3]),
    pearHash: chip('FNV-1a, 32 bits', PEAR.hash, null, { shown: { x: 100, y: 280 } }, [3]),
    pearBucket: chip('hash % 8', String(PEAR.bucket), 'c', { atBucket: chipAt(PEAR.bucket) }, [3]),
    pearMiss1: mark('no', 0, 3),
    pearMiss2: mark('no', 1, 3),
    pearEnd: { piece: 'text', html: '<span class="end-mark"><span class="end-word">end</span></span>', ch: [3],
      states: { shown: { x: entryX(1) + 216, y: rowY(5) } } },

    tally: { piece: 'text', text: TALLY, size: 34, ch: [4], states: { shown: { x: 100, y: 470 } } },

    code: { piece: 'code', ch: [5], lines: [
      ['', 'def lookup(buckets, key):'],
      ['', '    h = 2166136261'],
      ['4', '    for b in key.encode():'],
      ['5', '        h = (h ^ b) * 16777619 % 2**32'],
      ['6', '    bucket = buckets[h % 8]'],
      ['8', '    for k, v in bucket:'],
      ['9', '        if k == key:'],
      ['10', '            return v'],
      ['16', '    return None'],
    ], states: { shown: { x: 330, y: 200 }, hash: { x: 330, y: 200, cls: ['lit:2-5'] },
                 walk: { x: 330, y: 200, cls: ['lit:6-8'] }, miss: { x: 330, y: 200, cls: ['lit:9'] } } },
  },
  clicks: [
    { chapter: 1, caption: 'An example table with eight empty buckets, numbered 0 to 7.', object: 'table', state: 'empty', highlight: false },
    { chapter: 1, caption: 'Each fruit sits in the bucket its own hash picks.', object: 'table', state: 'filled', highlight: false, settle: 1900 },

    { chapter: 2, caption: 'To find the stock count of `fig`, start from the key.', object: 'figKey', state: 'shown', highlight: '.w-chip-value' },
    { chapter: 2, caption: 'The hash reads bytes, so `fig` becomes three numbers.', object: 'figBytes', state: 'shown', highlight: '.w-chip-value' },
    { chapter: 2, caption: 'FNV-1a mixes the three bytes into one 32-bit number.', object: 'figHash', state: 'shown', highlight: '.w-chip-value' },
    { chapter: 2, caption: 'The remainder after dividing by 8 picks the bucket.', object: 'figBucket', state: 'shown', highlight: '.w-chip-value' },
    { chapter: 2, object: 'figBucket', state: 'atBucket', highlight: false },
    { chapter: 2, caption: 'Bucket 5 holds two fruits, so compare the keys in order.', object: 'figMiss', state: 'shown', highlight: '[data-entry="5.0"]' },
    { chapter: 2, object: 'figHit', state: 'shown', highlight: '[data-entry="5.1"]' },
    { chapter: 2, caption: 'The lookup returns the count stored beside the key.', object: 'figValue', state: 'out', highlight: '.w-chip-value' },

    { chapter: 3, caption: 'Now look up `pear`, which was never stored.', object: 'pearKey', state: 'shown', highlight: '.w-chip-value' },
    { chapter: 3, caption: 'The same bytes and FNV-1a give `pear` its own hash.', object: 'pearHash', state: 'shown', highlight: '.w-chip-value' },
    { chapter: 3, caption: 'Its remainder is also 5, the same bucket as `fig`.', object: 'pearBucket', state: 'atBucket', highlight: '.w-chip-value' },
    { chapter: 3, caption: 'Same walk: compare each key in bucket 5.', object: 'pearMiss1', state: 'shown', highlight: '[data-entry="5.0"]' },
    { chapter: 3, object: 'pearMiss2', state: 'shown', highlight: '[data-entry="5.1"]' },
    { chapter: 3, caption: 'The list ends, so `pear` is not in the table.', object: 'pearEnd', state: 'shown', highlight: '.end-word' },

    { chapter: 4, caption: 'Neither lookup touched the other seven buckets.', object: 'table', state: 'focus', highlight: '[data-bucket="5"]' },
    { chapter: 4, caption: "The work depends on one bucket's length, not the table's size.", object: 'tally', state: 'shown' },

    { chapter: 5, caption: 'Each margin number is the click that showed that line.', object: 'code', state: 'shown', highlight: false },
    { chapter: 5, caption: 'These lines turn the key into a bucket number.', object: 'code', state: 'hash', highlight: false },
    { chapter: 5, caption: 'The loop is the walk down one bucket.', object: 'code', state: 'walk', highlight: false },
    { chapter: 5, caption: 'Falling off the end of the loop means the key is missing.', object: 'code', state: 'miss', highlight: false },
  ],
});
</script>
</body>
</html>
